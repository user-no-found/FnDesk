<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FnDesk 控制台</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --line: #d8e0e8;
      --line-strong: #b8c5d2;
      --text: #111827;
      --muted: #667085;
      --blue: #0b6bcb;
      --green: #13795b;
      --green-bg: #e7f6ef;
      --red: #b42318;
      --red-bg: #fde8e7;
      --amber: #9a6700;
      --amber-bg: #fff4d7;
      --neutral-bg: #edf1f5;
      --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button { font: inherit; }
    button {
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #f9fbfc; border-color: #8fa1b3; }
    button:disabled { color: #9aa6b2; background: #eef2f5; cursor: not-allowed; }
    button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    button.primary:hover:not(:disabled) { background: #0759ad; }
    button.danger { border-color: #d92d20; color: var(--red); }
    button.danger:hover:not(:disabled) { background: #fff3f2; }
    button.ghost { background: transparent; }
    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }
    main {
      width: min(980px, calc(100vw - 28px));
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      padding: clamp(8px, 2vh, 18px) 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, 1.4vh, 12px);
      overflow: hidden;
    }
    .card { min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
    .control-card { display: grid; grid-template-rows: auto auto; }
    .log-card { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .section-head {
      min-height: clamp(44px, 8vh, 52px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: clamp(10px, 1.7vh, 14px) 18px;
      border-bottom: 1px solid var(--line);
    }
    .section-head h2 { margin: 0; font-size: 16px; line-height: 1.2; }
    .section-body { min-height: 0; padding: clamp(10px, 2vh, 18px); }
    .control-body { min-height: 0; }
    .log-body { display: grid; min-height: 0; overflow: hidden; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 650;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge.ok { color: var(--green); background: var(--green-bg); border-color: #a8dec9; }
    .badge.warn { color: var(--amber); background: var(--amber-bg); border-color: #efd17b; }
    .badge.bad { color: var(--red); background: var(--red-bg); border-color: #f5aaa4; }
    .badge.neutral { color: #405164; background: var(--neutral-bg); border-color: #cbd5df; }
    .control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; }
    .status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: clamp(10px, 1.8vh, 14px); }
    .field { min-height: clamp(50px, 8vh, 64px); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: #fbfcfd; }
    .field .name { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .field .data { font-weight: 650; word-break: break-word; }
    .diagnostic-actions { display: grid; align-items: center; gap: 8px; grid-template-columns: repeat(4, max-content); justify-content: flex-end; }
    pre {
      min-height: 0;
      height: 100%;
      overflow: auto;
      margin: 0;
      padding: 14px;
      background: #111827;
      color: #dbeafe;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      max-width: min(720px, calc(100vw - 28px));
      min-height: 42px;
      display: none;
      align-items: center;
      border-radius: 8px;
      padding: 10px 14px;
      background: #17202a;
      color: #fff;
      box-shadow: 0 14px 34px rgba(17, 24, 39, 0.24);
      z-index: 10;
    }
    .toast.show { display: flex; }
    @media (max-width: 720px) {
      main { width: min(100vw - 16px, 980px); padding: 8px 0; }
      .control-grid, .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-head { padding: 10px 12px; }
      .section-body { padding: 10px 12px; }
      .log-card .section-head { align-items: flex-start; flex-direction: column; }
      .diagnostic-actions { justify-content: stretch; width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      button { min-height: 34px; padding: 0 10px; }
      .control-grid button, .diagnostic-actions button { width: 100%; }
    }
    @media (max-height: 620px) {
      button { min-height: 34px; }
      .section-head { min-height: 42px; }
      .field { min-height: 46px; }
      pre { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <section class="card control-card">
        <div class="section-head">
          <h2>本地控制</h2>
          <div class="diagnostic-actions">
            <span class="badge neutral" id="service-badge">检测中</span>
            <button id="refresh" type="button">刷新</button>
          </div>
        </div>
        <div class="section-body control-body">
          <div class="control-grid">
            <button class="primary" id="start" type="button">启动</button>
            <button id="stop" type="button">关闭</button>
            <button id="restart" type="button">重启</button>
          </div>
          <div class="status-grid">
            <div class="field">
              <div class="name">服务</div>
              <div class="data" id="local-service">-</div>
            </div>
            <div class="field">
              <div class="name">失败状态</div>
              <div class="data" id="failed-state">-</div>
            </div>
          </div>
        </div>
      </section>

      <section class="card log-card">
        <div class="section-head">
          <h2>诊断</h2>
          <div class="diagnostic-actions">
            <button class="ghost" id="logs-local" type="button">中文摘要</button>
            <button class="ghost" id="logs-local-raw" type="button">原始日志</button>
            <button class="ghost" id="logs-control" type="button">控制台日志</button>
            <button class="ghost" id="reset-failed" type="button">重置失败</button>
          </div>
        </div>
        <div class="section-body log-body">
          <pre id="logs">加载中...</pre>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const els = {
      serviceBadge: document.getElementById('service-badge'),
      localService: document.getElementById('local-service'),
      failedState: document.getElementById('failed-state'),
      logs: document.getElementById('logs'),
      toast: document.getElementById('toast'),
      start: document.getElementById('start'),
      stop: document.getElementById('stop'),
      restart: document.getElementById('restart'),
      resetFailed: document.getElementById('reset-failed'),
    };

    let logMode = 'local';
    let toastTimer = 0;

    function badgeClass(kind) {
      return `badge ${kind}`;
    }

    function showToast(text, kind) {
      clearTimeout(toastTimer);
      els.toast.textContent = text;
      els.toast.className = `toast show ${kind || ''}`;
      toastTimer = setTimeout(() => { els.toast.className = 'toast'; }, 3200);
    }

    function serviceText(value) {
      const map = {
        active: '运行中',
        inactive: '已停止',
        failed: '失败',
        activating: '启动中',
        deactivating: '停止中',
        unknown: '未知',
      };
      return map[value] || value || '未知';
    }

    function serviceKind(value, failed) {
      if (failed === 'failed') return 'bad';
      if (value === 'active') return 'ok';
      if (value === 'failed') return 'bad';
      if (value === 'inactive') return 'neutral';
      return 'warn';
    }

    async function api(path, options) {
      const requestOptions = Object.assign({ cache: 'no-store' }, options || {});
      const timeoutMs = requestOptions.timeoutMs || 6500;
      delete requestOptions.timeoutMs;
      const controller = new AbortController();
      requestOptions.signal = controller.signal;
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(path, requestOptions);
        const type = res.headers.get('content-type') || '';
        if (type.includes('application/json')) return res.json();
        return res.text();
      } finally {
        clearTimeout(timer);
      }
    }

    async function post(path) {
      const data = await api(path, { method: 'POST' });
      if (data && data.message) showToast(data.message, data.ok ? 'ok' : 'bad');
      await refresh();
      await loadLogs(logMode);
    }

    function render(status) {
      const local = status.services.local;
      const failed = local.failed || '';
      const kind = serviceKind(local.active, failed);
      const label = failed === 'failed' ? '失败' : serviceText(local.active);

      els.serviceBadge.textContent = label;
      els.serviceBadge.className = badgeClass(kind);
      els.localService.textContent = `${local.active || 'unknown'} / ${local.enabled || 'unknown'}`;
      els.failedState.textContent = failed || 'unknown';

      const active = local.active === 'active';
      els.start.disabled = active;
      els.stop.disabled = !active && failed !== 'failed';
      els.restart.disabled = false;
      els.resetFailed.disabled = failed !== 'failed';
    }

    async function refresh() {
      try {
        const data = await api('/api/status');
        if (data.ok) render(data.data);
      } catch (err) {
        els.serviceBadge.textContent = '连接失败';
        els.serviceBadge.className = badgeClass('bad');
        showToast(String(err), 'bad');
      }
    }

    async function loadLogs(mode) {
      logMode = mode;
      try {
        const unit = mode === 'control' ? 'control' : 'local';
        const format = mode === 'raw' ? '&format=raw' : '';
        els.logs.textContent = await api(`/api/logs?unit=${unit}&lines=180${format}`);
        if (!els.logs.textContent.trim()) els.logs.textContent = '暂无日志';
      } catch (err) {
        els.logs.textContent = String(err);
      }
    }

    document.getElementById('refresh').addEventListener('click', async () => {
      await refresh();
      await loadLogs(logMode);
    });
    els.start.addEventListener('click', () => post('/api/local/start'));
    els.stop.addEventListener('click', () => post('/api/local/stop'));
    els.restart.addEventListener('click', () => post('/api/local/restart'));
    els.resetFailed.addEventListener('click', () => post('/api/local/reset-failed'));
    document.getElementById('logs-local').addEventListener('click', () => loadLogs('local'));
    document.getElementById('logs-local-raw').addEventListener('click', () => loadLogs('raw'));
    document.getElementById('logs-control').addEventListener('click', () => loadLogs('control'));

    refresh();
    loadLogs('local');
    setInterval(refresh, 10000);
  </script>
</body>
</html>
